<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Café Lubre 伝票システム</title>
<style>
:root{--ink:#17302b;--iv:#1f5c4f;--mist:#eef3f1;--pp:#fff;--br:#b8892b;--ln:#d5e0dc;--mut:#6b827b}
*{box-sizing:border-box}
body{margin:0;background:var(--mist);color:var(--ink);font:15px/1.55 "Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
h1,h2,.tot{font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
h1{font-size:19px;margin:0 auto 0 0;color:var(--iv)}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:16px 0 6px;color:var(--iv)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--pp);border-bottom:2px solid var(--iv);position:sticky;top:0;z-index:5}
main{max-width:920px;margin:0 auto;padding:14px 14px 120px}
.card{background:var(--pp);border:1px solid var(--ln);border-radius:6px;padding:14px;margin-bottom:14px}
button,select,input,textarea{font:inherit;color:inherit;background:var(--pp);border:1px solid var(--ln);border-radius:6px;padding:7px 11px}
button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--br);outline-offset:1px}
button.p{background:var(--iv);color:#fff;border-color:var(--iv)}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.it{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--ln);border-radius:6px}
.it.sel{border-color:var(--iv);background:#e3efeb}.it small{color:var(--mut);display:block}
.q{display:flex;align-items:center;gap:6px}.q button{width:32px;padding:4px}.q b{min-width:18px;text-align:center}
table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-bottom:1px solid var(--ln);text-align:left}.n{text-align:right!important}
#me input{width:100%;padding:5px 8px}#me td{padding:4px}#me button{padding:4px 8px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--pp);border-top:2px solid var(--iv);padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.tot{font-size:24px;color:var(--br);font-weight:700}
.hide{display:none!important}.mut{color:var(--mut)}
#login{text-align:center;padding:90px 20px}#login h1{margin:0 0 10px;font-size:26px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--iv);color:#fff;padding:12px 20px;border-radius:6px;z-index:20;box-shadow:0 4px 16px #0003;max-width:90vw}
#toast.err{background:#9b2c2c}
</style></head><body>
<div id="toast" class="hide" role="status"></div>
<div id="login" class="hide"><h1>Café Lubre 伝票システム</h1>
<p id="lmsg" class="mut">スタッフ用です。Googleアカウントでログインしてください。</p>
<button class="p" id="bin">Googleでログイン</button> <button id="bout2" class="hide">ログアウトして別のアカウントでログイン</button></div>

<div id="app" class="hide">
<header><h1>Café Lubre</h1><select id="ev" aria-label="開催回"></select>
<span class="tabs"><button data-t="t1" class="on">伝票入力</button> <button data-t="t2">開催日別売上表</button> <button data-t="t3" id="tadm" class="hide">管理</button></span>
<span class="mut" id="who"></span><button id="bout">ログアウト</button></header>
<main>
<section id="t1"><div class="card"><h2>伝票入力</h2>
<input id="buyer" placeholder="購入者名" maxlength="40" style="width:100%;max-width:320px"> <span id="msg" class="mut"></span><div id="menu"></div></div>
<div class="bar"><span>合計</span><span class="tot" id="tot">0ギル</span><button id="rst">リセット</button><button class="p" id="ok">会計確定</button></div></section>

<section id="t2" class="hide"><div class="card"><h2>売上明細 <button id="csv" style="float:right">CSV出力</button></h2><div style="overflow-x:auto"><table id="det"></table></div></div>
<div class="card"><h2>商品別集計</h2><div style="overflow-x:auto"><table id="sum"></table></div></div></section>

<section id="t3" class="hide"><div class="card"><h2>開催回の作成・更新</h2>
<input type="date" id="ed"> <select id="es"><option>昼の部</option><option>夜の部</option></select> <button id="ld">この日付・時間帯のメニューを読み込む</button>
<p class="mut">日付と時間帯を選び、下の表でメニューを編集して「保存」します。同じ日付・時間帯で保存すると、メニューと単価が更新されます(過去の注文の単価は変わりません)。「▲▼」で並び順を変えられます。</p>
<div style="overflow-x:auto"><table id="me"><thead><tr><th>カテゴリ</th><th>商品名</th><th>単価(ギル)</th><th></th></tr></thead><tbody></tbody></table></div>
<datalist id="cats"></datalist>
<p><button id="ma">＋ 行を追加</button> <button class="p" id="mk">保存</button></p></div>
<div class="card"><h2>スタッフ管理</h2><input id="se" type="email" placeholder="Gmailアドレス"> <select id="sr"><option value="staff">スタッフ</option><option value="admin">管理者</option></select> <button class="p" id="sa">追加</button>
<table id="sl"></table></div></section>
</main></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,setDoc,deleteDoc,onSnapshot,query,orderBy,writeBatch}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBGLXJ28VOdVJ6cUP8OPMhmrljHmHWHLSw",authDomain:"cafe-lubre-system.firebaseapp.com",projectId:"cafe-lubre-system",storageBucket:"cafe-lubre-system.firebasestorage.app",messagingSenderId:"983066722844",appId:"1:983066722844:web:0341c0bfb220f0769515d9"};
const OWNER="paisenff14gamer@gmail.com";
const auth=getAuth(initializeApp(cfg)),db=getFirestore();
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen=n=>Number(n).toLocaleString()+"ギル";
let tt;const toast=(m,err,ms)=>{const t=$("#toast");t.textContent=m;t.className=err?"err":"";clearTimeout(tt);tt=setTimeout(()=>t.className="hide",ms||(err?5000:2500))};
const M={FOOD:[["オムライス",980],["ラセットポポトグラタン",980],["サーモンクリームパスタ",1080],["ビーフシチュー",980]],
BREAD:[["賢人サンドイッチ",880],["バナナパンズケーキ",780],["スイートマフィン",780],["ロイヤルトースト",600]],
SOUP:[["ベジタブルスープ",500],["クラムチャウダー",600],["パンプキンポタージュ",600]],
DRINK:[["オレンジジュース",500],["メロンジュース",500],["ワイルドバナナスムージー",800],["カモミールティー",500],["イシュガルドティー",600],["チャイ・トゥ・ヴヌー",600],["ドリップコーヒー",500],["シナモンホイップティー",600],["ホットココア",500]],
DESSERT:[["テンダーショートケーキ",700],["ガトーショコラ",800],["ババロア・オ・シューコン",600],["トラルパイナップルケーキ",600],["トラルフルーツのタルト",800],["ジャイアントポポトパンケーキ",700]],
SPECIAL:[["クッキー&ティー10個セット",2000],["高級マテ茶クッキー20個",2000],["マテ・スイートティー20個",2000],["ラムネジュース10個",500],["バタフライピー10個",500],["グレープジュース10個",500],["リンゴジュース10個",500]]};
let mr=Object.entries(M).flatMap(([c,a])=>a.map(([n,p])=>({cat:c,name:n,price:p})));
let me="",admin=false,evs=[],cur=null,cart={},orders=[],uO,uE,uS;
const stop=()=>{[uO,uE,uS].forEach(f=>f&&f());uO=uE=uS=null;cur=null;orders=[];evs=[];cart={};$("#buyer").value=""};
const view=a=>{$("#login").classList.toggle("hide",a);$("#app").classList.toggle("hide",!a)};
const tab=t=>{$$(".tabs button").forEach(x=>x.classList.toggle("on",x.dataset.t===t));["t1","t2","t3"].forEach(i=>$("#"+i).classList.toggle("hide",i!==t))};

$("#bin").onclick=()=>{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
 signInWithPopup(auth,p).catch(e=>{if(["auth/popup-closed-by-user","auth/cancelled-popup-request"].includes(e.code))return;
  toast({"auth/popup-blocked":"ポップアップがブロックされました。アドレスバー右端のアイコンから「常に許可」を選び、もう一度押してください。","auth/network-request-failed":"通信に失敗しました。ポップアップの許可や、広告ブロックなどの拡張機能を確認して、もう一度お試しください。"}[e.code]||"ログインに失敗しました: "+e.code,1,8000)})};
$("#bout").onclick=$("#bout2").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
 stop();$("#bout2").classList.add("hide");$("#bin").classList.remove("hide");
 if(!u){$("#lmsg").textContent="スタッフ用です。Googleアカウントでログインしてください。";return view(false)}
 me=(u.email||"").toLowerCase();let ok=me===OWNER;admin=ok;
 if(!ok){try{const s=await getDoc(doc(db,"staff",me));ok=s.exists();admin=ok&&s.data().role==="admin"}catch(e){}}
 if(!ok){$("#lmsg").textContent=`${me} は登録されていません。管理者にこのアドレスの登録を依頼してください。`;$("#bin").classList.add("hide");$("#bout2").classList.remove("hide");return view(false)}
 $("#who").textContent=me;$("#tadm").classList.toggle("hide",!admin);tab("t1");view(true);
 uE=onSnapshot(query(collection(db,"events"),orderBy("date","desc")),s=>{
  evs=s.docs.map(d=>({id:d.id,...d.data()}));const keep=cur&&cur.id;
  $("#ev").innerHTML=evs.map(e=>`<option value="${esc(e.id)}">${esc(e.date)} ${esc(e.slot)}</option>`).join("");
  pick((evs.find(e=>e.id===keep)||evs[0]||{}).id)},e=>toast("読み込みエラー: "+e.code,1));
 if(admin)uS=onSnapshot(collection(db,"staff"),s=>{
  $("#sl").innerHTML=s.docs.map(d=>`<tr><td>${esc(d.id)}</td><td>${d.data().role==="admin"?"管理者":"スタッフ"}</td><td class="n"><button data-rm="${esc(d.id)}">削除</button></td></tr>`).join("")});
});

function pick(id){
 const e=evs.find(x=>x.id===id),ch=!cur||!e||cur.id!==e.id;cur=e||null;if(e)$("#ev").value=e.id;
 if(ch){cart={};uO&&uO();orders=[];if(e)uO=onSnapshot(collection(db,"events",e.id,"orders"),s=>{orders=s.docs.map(d=>({id:d.id,...d.data()}));sales()})}
 menu();sales()}
$("#ev").onchange=e=>pick(e.target.value);

function menu(){
 const m=$("#menu");
 if(!cur){m.innerHTML='<p class="mut">開催回がありません。管理者は「管理」タブで開催回を作成してください。</p>';return total()}
 const g={};cur.menu.forEach((x,i)=>(g[x.cat]=g[x.cat]||[]).push([x,i]));
 m.innerHTML=Object.entries(g).map(([c,a])=>`<h3>${esc(c)}</h3><div class="grid">`+a.map(([x,i])=>
  `<div class="it ${cart[i]?"sel":""}"><span>${esc(x.name)}<small>${yen(x.price)}</small></span><span class="q"><button data-i="${i}" data-d="-1" aria-label="減らす">−</button><b>${cart[i]||0}</b><button data-i="${i}" data-d="1" aria-label="増やす">＋</button></span></div>`).join("")+"</div>").join("");
 total()}
function total(){$("#tot").textContent=yen(Object.entries(cart).reduce((s,[i,q])=>s+(cur&&cur.menu[i]?cur.menu[i].price*q:0),0))}
$("#menu").onclick=e=>{const b=e.target.closest("button[data-i]");if(!b)return;const i=b.dataset.i;cart[i]=Math.max(0,(cart[i]||0)+ +b.dataset.d);menu()};
$("#rst").onclick=()=>{cart={};menu()};
$("#ok").onclick=async()=>{
 const b=$("#buyer").value.trim(),ls=Object.entries(cart).filter(([,q])=>q>0);
 if(!cur)return toast("開催回がありません。",1);
 if(!b)return toast("購入者名を入力してください。",1);
 if(!ls.length)return toast("商品を1つ以上選んでください。",1);
 const wb=writeBatch(db),t=Date.now();
 ls.forEach(([i,q])=>{const x=cur.menu[i];wb.set(doc(collection(db,"events",cur.id,"orders")),{buyer:b,item:x.name,cat:x.cat,price:x.price,qty:q,total:x.price*q,by:me,t})});
 try{await wb.commit();cart={};$("#buyer").value="";menu();$("#msg").textContent=`直前: ${b} さん`;toast(`${b} さんの伝票を保存しました`)}catch(e){toast("保存に失敗しました: "+e.code,1)}};

function sales(){
 if(!cur){$("#det").innerHTML=$("#sum").innerHTML="";return}
 const o=[...orders].sort((a,b)=>a.t-b.t),ix=n=>cur.menu.findIndex(x=>x.name===n);
 $("#det").innerHTML="<tr><th>購入者</th><th>商品</th><th class=n>単価</th><th class=n>数量</th><th class=n>正味金額</th><th></th></tr>"+
  o.map(r=>`<tr><td>${esc(r.buyer)}</td><td>${esc(r.item)}</td><td class=n>${yen(r.price)}</td><td class=n>${r.qty}</td><td class=n>${yen(r.total)}</td><td class=n><button data-del="${r.id}">削除</button></td></tr>`).join("");
 const s={};o.forEach(r=>{const k=s[r.item]=s[r.item]||{q:0,m:0};k.q+=r.qty;k.m+=r.total});
 const q=o.reduce((a,r)=>a+r.qty,0),m=o.reduce((a,r)=>a+r.total,0);
 $("#sum").innerHTML="<tr><th>商品</th><th class=n>数量</th><th class=n>正味金額</th></tr>"+
  Object.entries(s).sort((a,b)=>ix(a[0])-ix(b[0])).map(([n,v])=>`<tr><td>${esc(n)}</td><td class=n>${v.q}</td><td class=n>${yen(v.m)}</td></tr>`).join("")+
  `<tr><th>合計</th><th class=n>${q}</th><th class="n tot">${yen(m)}</th></tr>`}
$("#det").onclick=async e=>{const b=e.target.closest("button[data-del]");if(b&&cur&&confirm("この明細を削除しますか?"))await deleteDoc(doc(db,"events",cur.id,"orders",b.dataset.del)).catch(x=>toast("削除に失敗しました: "+x.code,1))};
$("#csv").onclick=()=>{if(!cur)return;const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
 const r=[["購入者","商品","単価","数量","正味金額"],...[...orders].sort((a,b)=>a.t-b.t).map(o=>[o.buyer,o.item,o.price,o.qty,o.total])];
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+r.map(x=>x.map(q).join(",")).join("\r\n")],{type:"text/csv"}));a.download=cur.id+".csv";a.click()};

function mrender(){
 $("#me tbody").innerHTML=mr.map((x,i)=>`<tr><td><input list="cats" data-k="cat" data-i="${i}" value="${esc(x.cat)}" aria-label="カテゴリ"></td><td><input data-k="name" data-i="${i}" value="${esc(x.name)}" aria-label="商品名"></td><td><input type="number" min="0" step="1" data-k="price" data-i="${i}" value="${esc(x.price)}" aria-label="単価"></td><td class="n" style="white-space:nowrap"><button data-up="${i}" aria-label="上へ">▲</button> <button data-dn="${i}" aria-label="下へ">▼</button> <button data-mdel="${i}">削除</button></td></tr>`).join("");
 $("#cats").innerHTML=[...new Set(mr.map(x=>x.cat).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("")}
$("#me").oninput=e=>{const t=e.target,i=t.dataset.i;if(i!=null)mr[i][t.dataset.k]=t.value};
$("#me").onclick=e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.up!=null){const i=+d.up;if(i>0)[mr[i-1],mr[i]]=[mr[i],mr[i-1]]}
 else if(d.dn!=null){const i=+d.dn;if(i<mr.length-1)[mr[i+1],mr[i]]=[mr[i],mr[i+1]]}
 else if(d.mdel!=null)mr.splice(+d.mdel,1);
 mrender()};
$("#ma").onclick=()=>{const l=mr[mr.length-1];mr.push({cat:l?l.cat:"",name:"",price:""});mrender();$$("#me input[data-k=name]").pop().focus()};
$("#ld").onclick=()=>{const d=$("#ed").value,s=$("#es").value;if(!d)return toast("日付を選んでください。",1);
 const e=evs.find(x=>x.id===d+"_"+s);if(!e)return toast(`${d} ${s} の開催回はまだ作成されていません。`,1);
 mr=e.menu.map(x=>({...x}));mrender();toast(`${d} ${s} のメニューを読み込みました`)};
$("#mk").onclick=async()=>{
 const date=$("#ed").value,slot=$("#es").value;if(!date)return toast("日付を選んでください。",1);
 const mn=[];for(const x of mr){const c=String(x.cat).trim(),n=String(x.name).trim(),p=String(x.price).trim();if(!c&&!n&&!p)continue;
  if(!c||!n||!p||!Number.isFinite(+p)||+p<0)return toast("カテゴリ・商品名・単価をすべて正しく入力してください。",1);mn.push({cat:c,name:n,price:Math.round(+p)})}
 if(!mn.length)return toast("メニューを入力してください。",1);
 if(new Set(mn.map(x=>x.name)).size!==mn.length)return toast("同じ商品名が重複しています。",1);
 try{await setDoc(doc(db,"events",date+"_"+slot),{date,slot,menu:mn,by:me});toast(`${date} ${slot} を保存しました`)}catch(e){toast("保存に失敗しました: "+e.code,1)}};
$("#sa").onclick=async()=>{const m=$("#se").value.trim().toLowerCase();if(!m.includes("@"))return toast("メールアドレスを入力してください。",1);
 try{await setDoc(doc(db,"staff",m),{role:$("#sr").value});$("#se").value="";toast("追加しました")}catch(e){toast("追加に失敗しました: "+e.code,1)}};
$("#sl").onclick=async e=>{const b=e.target.closest("button[data-rm]");if(b&&confirm(b.dataset.rm+" を削除しますか?"))await deleteDoc(doc(db,"staff",b.dataset.rm))};
$$(".tabs button").forEach(b=>b.onclick=()=>tab(b.dataset.t));
$("#ed").value=new Date().toLocaleDateString("sv-SE");mrender();
</script></body></html>
